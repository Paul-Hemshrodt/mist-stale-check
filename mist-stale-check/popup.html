<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 14px 16px;
    min-width: 220px;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 4px;
  }
  p.hint {
    margin: 0 0 10px;
    color: #666;
    font-size: 12px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 2px;
    cursor: pointer;
    border-radius: 4px;
  }
  label:hover { background: #f2f2f2; }
  #saved {
    height: 16px;
    margin-top: 8px;
    font-size: 12px;
    color: #2e7d32;
  }
</style>
</head>
<body>
<h1>Mist Stale Check</h1>
<p class="hint">How often to re-check the open page while the tab is visible.
Takes effect immediately on open Mist tabs.</p>
<div id="options"></div>
<div id="saved"></div>
<script src="popup.js"></script>
</body>
</html>
